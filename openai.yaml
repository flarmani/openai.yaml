openapi: 3.1.0
info:
  title: League Patch Proxy API
  description: Access champion, item, and version data from Riot's public CDN via a proxy. Supports filters, pagination, and real-time patch info.
  version: 1.1.0
servers:
  - url: https://leagserver.onrender.com

paths:
  /champions:
    get:
      operationId: getChampions
      summary: Get a list of champions with optional filters
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: jinx
        - name: tag
          in: query
          required: false
          schema:
            type: string
            example: Mage
        - name: version
          in: query
          required: false
          schema:
            type: string
            example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en_US
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: A list of filtered champions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: {}

  /champions/{id}:
    get:
      operationId: getChampionById
      summary: Get full details of a specific champion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jinx
        - name: version
          in: query
          required: false
          schema:
            type: string
            example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en_US
      responses:
        '200':
          description: Champion details
          content:
            application/json:
              schema:
                type: object
                properties: {}

  /items:
    get:
      operationId: getItems
      summary: Get a list of items with optional filters
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: Infinity Edge
        - name: minGold
          in: query
          required: false
          schema:
            type: integer
            example: 3000
        - name: tag
          in: query
          required: false
          schema:
            type: string
            example: Legendary
        - name: version
          in: query
          required: false
          schema:
            type: string
            example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en_US
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: A list of filtered items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: {}

  /versions:
    get:
      operationId: getVersions
      summary: Get the current patch version and full version history
      responses:
        '200':
          description: Latest and all available patch versions
          content:
            application/json:
              schema:
                type: object
                properties: {}

