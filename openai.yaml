openapi: 3.1.0
info:
  title: League Pick and Rune Coach
  description: Provides up-to-date League of Legends champion, item, and patch data using the Riot Data Dragon API through a proxy.
  version: 1.0.0
servers:
  - url: https://leagserver.onrender.com
paths:
  /champions:
    get:
      operationId: getChampions
      summary: Get up-to-date champion data
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
          example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
          example: en_US
      responses:
        "200":
          description: A list of filtered champions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: {}
  /champions/{id}:
    get:
      operationId: getChampionById
      summary: Get champion detail by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: Aatrox
      responses:
        "200":
          description: Champion detail object
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /items:
    get:
      operationId: getItems
      summary: Get up-to-date item data
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
          example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
          example: en_US
      responses:
        "200":
          description: A list of items
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /versions:
    get:
      operationId: getVersions
      summary: Get the current patch version and full version history
      responses:
        "200":
          description: Latest and previous patch versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas: {}
