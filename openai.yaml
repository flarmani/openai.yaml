openapi: 3.1.0
info:
  title: League Patch Proxy API
  description: Real-time access to Riot's champion and item data via a custom proxy.
  version: 1.0.0
servers:
  - url: https://leagserver.onrender.com  # Use your real Render domain here
paths:
  /champions:
    get:
      operationId: getChampions
      summary: Get up-to-date champion data
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en_US
      responses:
        '200':
          description: Champion data
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /items:
    get:
      operationId: getItems
      summary: Get up-to-date item data
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            example: 14.9.1
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en_US
      responses:
        '200':
          description: Item data
          content:
            application/json:
              schema:
                type: object
                properties: {}
